<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <title>Password Generate</title>
    <link rel="stylesheet" href="Password Generate.css">
</head>
<body>

    <div class="container">

        <h1>Password Generate</h1>

        <div class="tabs">
            <button class="tab active" onclick="showTab('passwordTab')">Mot de passe</button>
            <button class="tab" onclick="showTab('pseudoTab')">Pseudo</button>
            <button class="tab" onclick="showTab('searchTab')">Recherche</button>
        </div>

        <div id="passwordTab" class="tabContent active">
            <input type="text" id="password" placeholder="Password Generate">
            <button onclick="generatePassword()">Generate</button>
        </div>

        <div id="pseudoTab" class="tabContent">
            <input type="text" id="pseudo" placeholder="Pseudo Generate">
            <button onclick="generatePseudo()">Pseudo Generate</button>
        </div>

        <div id="searchTab" class="tabContent">
            <input type="text" id="searchInput" placeholder="Rechercher…">
            <button onclick="search()">Rechercher</button>
            <p id="searchResult"></p>
        </div>

    </div>

    <script src="Password Generate.js"></script>
</body>
</html>
